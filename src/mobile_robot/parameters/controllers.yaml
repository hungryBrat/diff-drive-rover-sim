controller_manager:
  ros__parameters:
    update_rate: 250
    use_sim_time: true
    joint_state_broadcaster: 
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller: 
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ['wheel2_joint']
    right_wheel_names: ['wheel1_joint']
    wheel_separation: 0.7
    wheel_radius: 0.15
    use_sim_time: true
    odom_frame_id: odom
    base_frame_id: base_footprint

    # TwistStamped disabled in simulation because-
    # a stamped command gets an age check — the 
    # controller computes now - header.stamp and 
    # drops anything older than cmd_vel_timeout (0.5s). 
    # Your controller runs on the sim clock; teleop would
    # stamp with the wall clock. Those two clocks don't match, 
    # so every command reads as ancient and gets silently discarded. 
    # That mismatch is exactly why, in simulation, the clean 
    # choice is to drop the stamp entirely — no stamp, 
    # no age check, no clock problem.
  

# NOTE: TwistStamped can't be disabled in Jazzy
